<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#0b140f;--card:#111d17;--tx:#e6eef0;--mut:#8fa39a;--ln:#1f3228;--ac:#5b8bf3;--acbg:rgba(91,139,243,.14);--ok:#4fd1a1;--on:#07110c;--glow:rgba(91,139,243,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 380px at 50% -140px,rgba(91,139,243,.20),transparent 70%),var(--bg);background-repeat:no-repeat;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{padding:22px 16px 8px;max-width:1000px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:58px;height:auto;border-radius:14px;box-shadow:0 0 0 1px var(--ln),0 0 26px var(--glow)}
h1{margin:0;font:700 30px/1.1 Cinzel,"Trajan Pro",Georgia,serif;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 22px var(--glow)}
.tag{color:var(--ac);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.bar{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}
.tab.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600;box-shadow:0 0 16px var(--glow)}
#q,.in{flex:1;min-width:140px;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:8px;font:inherit}
.btn{border:0;background:var(--ac);color:var(--on);font-weight:600;padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
.add{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
main{max-width:1000px;margin:0 auto;padding:0 16px 40px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--ln);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:10px;border-bottom:1px solid var(--ln)}
td{padding:6px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.z{font-weight:600}
td.c{color:var(--mut);white-space:nowrap}
td.d{white-space:nowrap;font-size:13px}
.rel.ok{color:var(--ok)}.rel.mid{color:#e0a83a}.rel.old{color:#ef6b6b}
.seen{border:0;background:transparent;cursor:pointer;margin-left:6px;font-size:14px}
input.f{width:100%;border:1px solid transparent;background:transparent;color:var(--tx);padding:6px 8px;border-radius:6px;font:inherit}
input.f:hover{border-color:var(--ln)}
input.f:focus{outline:2px solid var(--ac);background:var(--bg)}
tr.has td.z{color:var(--ac)}
.note{margin:10px 0;color:var(--mut);font-size:13px}
.g{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln)}
.g:last-child{border-bottom:0}
.g .r{display:flex;align-items:center;gap:10px}
.n{background:var(--acbg);color:var(--ac);border-radius:999px;padding:0 10px;font-weight:700}
.del,.x{border:1px solid var(--ln);background:transparent;color:var(--mut);border-radius:6px;padding:2px 10px;cursor:pointer;font:inherit}
.x{padding:0 7px;margin-left:8px;font-size:12px}
.empty{padding:16px;color:var(--mut)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:5px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac)}
.tools select{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:6px 10px;border-radius:8px;font:inherit;font-size:13px}
td.cp{cursor:pointer}td.cp:hover{color:var(--ac);text-decoration:underline}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.wrap{box-shadow:0 0 0 1px var(--ln),0 10px 40px rgba(0,0,0,.35)}
tbody tr:hover{background:rgba(91,139,243,.06)}
tr.has td.z{text-shadow:0 0 14px var(--glow)}
#q:focus,.in:focus,.tools select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
input.f:focus{box-shadow:0 0 0 3px var(--glow)}
.tab:hover,.chip:hover{border-color:var(--ac)}
::selection{background:var(--ac);color:var(--on)}
[hidden]{display:none!important}
.perco-remove{border:1px solid #794344;background:rgba(190,55,65,.12);color:#f1a3a3;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:16px}.perco-remove:hover{background:#a83c45;color:white}

/* Donjons compacts et dépliables */
.dungeon-group{border-bottom:1px solid var(--ln)}
.dungeon-summary{width:100%;border:0;background:transparent;color:var(--tx);display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;text-align:left;font:inherit}
.dungeon-summary:hover{background:rgba(91,139,243,.08)}
.dungeon-name{flex:1;font-weight:650}.dungeon-arrow{color:var(--ac);font-size:12px;width:14px}.dungeon-count{color:var(--mut);font-size:12px;white-space:nowrap}
.dungeon-slots{display:flex;gap:5px;flex-wrap:wrap}.slot{font-size:11px;padding:3px 7px;border-radius:6px;border:1px solid var(--ln);color:var(--mut)}.slot.busy{background:var(--acbg);color:var(--ac);border-color:var(--ac)}
.dungeon-detail{padding:0 12px 12px 38px}.dungeon-detail table{min-width:570px}.dungeon-detail th{padding:7px 9px}.dungeon-detail td{padding:4px 9px}.dungeon-detail td.z{font-weight:500;color:var(--mut)}
.dungeon-detail[hidden]{display:none}.dungeon-group.filtered{display:none}
.perco-remove{border:1px solid #713c44;background:rgba(220,80,90,.09);color:#f19ca5;border-radius:7px;cursor:pointer;padding:4px 9px}
@media(max-width:650px){.dungeon-summary{gap:7px;padding:11px}.dungeon-slots{gap:3px}.slot{padding:2px 5px}.dungeon-detail{padding:0 6px 10px}}
.dungeon-summary{cursor:default;justify-content:space-between;padding-bottom:6px}.boss-detail{padding:0 10px 4px}.boss-detail table{min-width:620px}.rooms-toggle{width:100%;display:flex;align-items:center;gap:10px;border:0;border-top:1px solid var(--ln);padding:9px 16px;background:transparent;color:var(--mut);cursor:pointer;text-align:left}.rooms-toggle:hover{color:var(--tx);background:rgba(91,139,243,.06)}.rooms-toggle .dungeon-slots{margin-left:8px}.dungeon-group{overflow-x:auto}

/* Présentation synthétique des donjons */
.dungeon-group{padding:10px 14px 12px;border-bottom:1px solid var(--ln)}
.dungeon-group:nth-child(even){background:rgba(255,255,255,.018)}
.dungeon-summary{padding:2px 0 8px;gap:12px;align-items:center}
.dungeon-name{font-weight:700;font-size:15px;line-height:1.35}
.dungeon-count{flex-shrink:0;font-size:12px;color:var(--mut);background:var(--bg);padding:3px 9px;border-radius:20px}
.boss-detail{padding:0;overflow-x:auto}
.boss-detail table{min-width:0;width:100%;table-layout:fixed}
.boss-detail thead{display:none}
.boss-detail td{padding:5px 7px;border-bottom:0}
.boss-detail td:nth-child(1){width:21%;color:var(--ok);font-weight:700}
.boss-detail td:nth-child(2){width:24%}
.boss-detail td:nth-child(3){width:24%}
.boss-detail td:nth-child(4){width:25%}
.boss-detail td:nth-child(5){width:6%}
.boss-detail tr{background:rgba(79,209,161,.035);border-radius:7px}
.room-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 4px 0}
.rooms-toggle{width:auto;flex:0 0 auto;padding:4px 8px;border-radius:7px;background:var(--bg);gap:7px;font-size:12px}
.rooms-occupancy{color:var(--mut)}
.dungeon-slots{display:flex;gap:5px;flex-wrap:wrap}
.slot{display:inline-flex;justify-content:center;align-items:center;min-width:28px;height:27px;padding:0 5px;font-size:12px;border-radius:6px}
.slot.busy{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:700}
.dungeon-detail{padding:9px 0 0;overflow-x:auto}
.dungeon-detail table{min-width:620px}
@media(max-width:650px){.dungeon-group{padding:10px 8px}.boss-detail table{min-width:550px}.room-strip{gap:5px}.dungeon-name{font-size:14px}}
</style>
</head>

function guildNames(){
 const m=new Map();D.guildes.forEach(g=>m.set(hex(g),g));
 Object.entries(gd).forEach(([k,v])=>{if(v.removed)m.delete(k);else if(v.name)m.set(k,v.name)});
 return [...m.values()].sort((a,b)=>a.localeCompare(b));
}
const canon=n=>guildNames().find(g=>g.toLowerCase()===n.toLowerCase())||n;
function addGuild(name){
 name=name.trim();if(!name)return;
 const k=hex(name);gd[k]={name:canon(name),removed:false};
 if(gColl)gColl.doc(k).set(gd[k]).catch(warn);
 paint();
}
function removeGuild(name){
 const k=hex(name);gd[k]={name,removed:true};
 if(gColl)gColl.doc(k).set(gd[k]).catch(warn);
 Object.keys(st).forEach(key=>{if(st[key].guilde===name)save(key,{guilde:'',date:''})});

}

function hiddenKeys(t){

function restoreRows(){

function save(key,patch){
 if(patch.guilde){patch.guilde=canon(patch.guilde);if(!guildNames().includes(patch.guilde))addGuild(patch.guilde)}
 const cur=st[key]||{guilde:'',date:'',commentaire:''};
 if(patch.date!==undefined)patch.par=patch.date?pseudo:'';
 const nv=Object.assign({},cur,patch);st[key]=nv;paint();
 if(coll)coll.doc(key).set(nv).catch(warn);
}
function rowsOf(t){
 const src=t==='autres'?D.autres:TABS[t].rows;
 const base=src.flatMap((r,i)=>{
  if(t!=='donjons')return [{k:id(t,i),a:r[0],b:r[1]}];
  const name=r[0].toLowerCase();
  const count=/firefoux/.test(name)?6:/krala|kralamoure/.test(name)?2:/p[ée]ki garou|ch[êe]ne mou|blop multi/.test(name)?0:4;
  return [{k:count?id(t,i)+'_boss':id(t,i),a:r[0],b:'Boss'},...Array.from({length:count},(_,n)=>({k:/^blop$/.test(name)?'blop_commun_salle_'+(n+1):id(t,i)+'_salle_'+(n+1),a:r[0],b:'Salle '+(n+1)}))];
 }).filter(r=>!(st[r.k]&&st[r.k].hidden));
 if(t!=='autres'&&t!=='zones')return base;
 const ex=Object.entries(cu).filter(([d,v])=>(v.t||'autres')===t).sort((x,y)=>(x[1].at||'').localeCompare(y[1].at||'')).map(([d,v])=>({k:'lieu_'+d,a:v.nom||'',b:v.coords||'',d}));
 return base.concat(ex);
}

 t.innerHTML=F.map(([k,l])=>'<button class="chip'+(flt===k?' on':'')+'" data-f="'+k+'">'+l+'</button>').join('')+
 '<select id="srt"><option value="orig">Ordre d’origine</option><option value="old">Les plus anciens d’abord</option><option value="new">Les plus récents d’abord</option></select>'+
 (hk.length?'<button class="chip" id="rst">↺ Restaurer les supprimés ('+hk.length+')</button>':'');
 t.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;drawTools();filter()});

function sortRows(){
 const tb=document.querySelector('#out tbody');if(!tb)return;
 if(tab==='donjons')return;
 if(srt==='orig'&&!wasSorted)return;
 const act=document.activeElement;
 if(act&&tb.contains(act)&&act.tagName==='INPUT')return;
 wasSorted=srt!=='orig';
 const ts=tr=>{const v=st[tr.dataset.k];return v&&v.guilde&&v.date?new Date(v.date).getTime():null};
 const rows=[...tb.querySelectorAll('tr[data-k]')];
 rows.sort((x,y)=>{
  if(srt==='orig')return x.dataset.i-y.dataset.i;
  const p=ts(x),q=ts(y);
  if(p===null&&q===null)return x.dataset.i-y.dataset.i;
  if(p===null)return 1;
  if(q===null)return -1;
  return srt==='old'?p-q:q-p;
 });
 rows.forEach(r=>tb.appendChild(r));
}

const expandedDungeons=new Set();
function buildDungeonRows(){
 const out=$('#out');
 const blopIndices=D.donjons.map((r,i)=>/^blop$/i.test(r[0])?i:-1).filter(i=>i>=0);
 const firstBlop=blopIndices[0];
 const groups=D.donjons.map((r,i)=>{
  if(blopIndices.includes(i)&&i!==firstBlop)return '';
  const isBlop=i===firstBlop;
  const indices=isBlop?blopIndices:[i];
  const all=indices.flatMap(n=>rowsOf('donjons').filter(x=>x.k===id('donjons',n)||x.k===id('donjons',n)+'_boss'||x.k.startsWith(id('donjons',n)+'_salle_')||(isBlop&&x.k.startsWith('blop_commun_salle_'))));

  const bosses=unique.filter(x=>x.b==='Boss');const rooms=unique.filter(x=>x.b!=='Boss');
  const busy=unique.filter(x=>(st[x.k]||{}).guilde).length;
  const open=expandedDungeons.has(i);
  const slots=rooms.map(x=>'<span class="slot'+((st[x.k]||{}).guilde?' busy':'')+'" title="'+esc(x.b)+' — '+esc((st[x.k]||{}).guilde||'Libre')+'">'+esc(x.b.replace('Salle ',''))+'</span>').join('');
  const tr=(x,j)=>'<tr data-i="'+j+'" data-k="'+esc(x.k)+'" data-b="'+esc((x.a+' '+x.b).toLowerCase())+'"><td class="z">'+esc(isBlop&&x.b==='Boss'?'Boss '+D.donjons[indices.find(n=>x.k===id('donjons',n)+'_boss')||indices[0]][1]:x.b)+'</td><td><input class="f g1" list="gl" placeholder="Guilde…" aria-label="Guilde du percepteur"></td><td class="d"><span class="rel"></span><button class="seen" title="Marquer comme vu maintenant" hidden>👁</button></td><td><input class="f c1" placeholder="Commentaire…"></td><td><button class="perco-remove" title="Supprimer le percepteur" aria-label="Supprimer le percepteur">✕</button></td></tr>';
  const head='<table><thead><tr><th>Emplacement</th><th>Guilde perco</th><th>Dernière vue</th><th>Commentaire</th><th>Action</th></tr></thead><tbody>';
  return '<section class="dungeon-group" data-dungeon="'+i+'"><div class="dungeon-summary"><span class="dungeon-name">'+esc(isBlop?'Donjon des Blops — Salles communes':r[0]+(r[1]?' — '+r[1]:''))+'</span><span class="dungeon-count">'+busy+' / '+unique.length+'</span></div><div class="boss-detail">'+head+bosses.map(tr).join('')+'</tbody></table></div>'+(rooms.length?'<div class="room-strip"><button class="rooms-toggle" aria-expanded="'+open+'"><span class="dungeon-arrow">'+(open?'▼':'▶')+'</span><span>Salles</span><span class="rooms-occupancy">'+rooms.filter(x=>(st[x.k]||{}).guilde).length+'/'+rooms.length+'</span></button><div class="dungeon-slots">'+slots+'</div></div><div class="dungeon-detail" '+(open?'':'hidden')+'>'+head+rooms.map((x,j)=>tr(x,j+bosses.length)).join('')+'</tbody></table></div>':'')+'</section>';
 }).join('');
 out.innerHTML=groups;
 out.querySelectorAll('.dungeon-group').forEach(group=>{
  const i=Number(group.dataset.dungeon);const btn=group.querySelector('.rooms-toggle');if(btn)btn.onclick=()=>{if(expandedDungeons.has(i))expandedDungeons.delete(i);else expandedDungeons.add(i);buildDungeonRows()};
 });
 out.querySelectorAll('tr[data-k]').forEach(tr=>{
  const k=tr.dataset.k;
  tr.querySelector('.g1').onchange=e=>{const g=e.target.value.trim();save(k,{guilde:g,date:g?new Date().toISOString():''})};
  tr.querySelector('.c1').onchange=e=>save(k,{commentaire:e.target.value.trim()});
  tr.querySelector('.perco-remove').onclick=()=>{if((st[k]||{}).guilde)save(k,{guilde:'',date:'',commentaire:'',par:''})};
  tr.querySelector('.seen').onclick=()=>{if((st[k]||{}).guilde)save(k,{date:new Date().toISOString()})};
 });paint();
}
function buildRows(){
 if(tab==='guildes')return;
 const T=TABS[tab],out=$('#out');
 if(tab==='donjons'){buildDungeonRows();return;}
 out.innerHTML='<table><thead><tr><th>'+T.head[0]+'</th><th>'+T.head[1]+'</th><th>Guilde perco</th><th>Dernière vue</th><th>Commentaire</th><th>Action</th></tr></thead><tbody>'+
 rowsOf(tab).map((r,i)=>'<tr data-i="'+i+'" data-k="'+esc(r.k)+'" data-b="'+esc((r.a+' '+r.b).toLowerCase())+'"><td class="z">'+esc(r.a)+((tab==='zones'||tab==='autres')?'<button class="x" data-act="r" data-key="'+esc(r.k)+'" title="Supprimer cette ligne">✕</button>':'')+'</td><td class="c'+(r.b&&tab!=='donjons'?' cp':'')+'" data-cp="'+esc(coord(r.b))+'" title="'+(r.b&&tab!=='donjons'?'Cliquer pour copier':'')+'">'+esc(coord(r.b))+'</td><td><input class="f g1" list="gl" placeholder="Guilde…"></td><td class="d"><span class="rel"></span><button class="seen" title="Marquer comme vu maintenant" hidden>👁</button></td><td><input class="f c1" placeholder="Commentaire…"></td><td><button class="perco-remove" title="Supprimer le percepteur" aria-label="Supprimer le percepteur">✕</button></td></tr>').join('')+'</tbody></table>';
 out.querySelectorAll('tr[data-k]').forEach(tr=>{
  const k=tr.dataset.k;
  tr.querySelector('.g1').onchange=e=>{const g=e.target.value.trim();save(k,{guilde:g,date:g?new Date().toISOString():''})};
  tr.querySelector('.c1').onchange=e=>save(k,{commentaire:e.target.value.trim()});
  tr.querySelector('.perco-remove').onclick=()=>{if((st[k]||{}).guilde)save(k,{guilde:'',date:'',commentaire:'',par:''})};
  tr.querySelector('.seen').onclick=()=>{if((st[k]||{}).guilde)save(k,{date:new Date().toISOString()})};
 });

function paint(){
 const names=guildNames();
 $('#gl').innerHTML=names.map(g=>'<option value="'+esc(g)+'">').join('');
 if(tab==='guildes'){
  const cnt={};names.forEach(g=>cnt[g]=0);
  Object.values(st).forEach(v=>{if(v.guilde&&v.guilde in cnt)cnt[v.guilde]++});
  const l=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  $('#out').innerHTML=l.length?l.map(([g,n])=>'<div class="g"><span>'+esc(g)+'</span><span class="r"><span class="n">'+n+'</span><button class="del" data-act="g" data-key="'+esc(g)+'">'+(pend==='g'+g?'Sûr ?':'Supprimer')+'</button></span></div>').join(''):'<div class="empty">Aucune guilde. Ajoute-en une ci-dessus.</div>';
  return;
 }
 document.querySelectorAll('#out tr[data-k]').forEach(tr=>{
  const v=st[tr.dataset.k]||{guilde:'',date:'',commentaire:''};
  const g=tr.querySelector('.g1'),c=tr.querySelector('.c1');
  if(document.activeElement!==g)g.value=v.guilde||'';
  if(document.activeElement!==c)c.value=v.commentaire||'';
  const rel=tr.querySelector('.rel');rel.textContent=ago(v.date)+(v.date&&v.par?' par '+v.par:'');rel.title=fmt(v.date)+(v.par?' — '+v.par:'');rel.className='rel '+fresh(v.date);
  tr.querySelector('.seen').hidden=!v.guilde;
  tr.querySelector('.perco-remove').hidden=!v.guilde;
  tr.classList.toggle('has',!!v.guilde);
  tr.dataset.s=tr.dataset.b+'|'+(v.guilde||'').toLowerCase();
  tr.dataset.free=v.guilde?'':'1';
  tr.dataset.stale=(v.guilde&&(!v.date||Date.now()-new Date(v.date)>259200000))?'1':'';
 });
 if(tab==='donjons'){
  document.querySelectorAll('.dungeon-group').forEach(group=>{
   const rows=[...group.querySelectorAll('tr[data-k]')];const busy=rows.filter(r=>(st[r.dataset.k]||{}).guilde).length;
   group.querySelector('.dungeon-count').textContent=busy+' / '+rows.length;

  });
 }

 filter();
}

  const detail=group.querySelector('.dungeon-detail');const btn=group.querySelector('.rooms-toggle');
  if(detail&&btn){const i=Number(group.dataset.dungeon);const show=(!!q||flt!=='all')&&[...detail.querySelectorAll('tr')].some(r=>r.style.display!=='none');const open=show||expandedDungeons.has(i);detail.hidden=!open;btn.setAttribute('aria-expanded',String(open));btn.querySelector('.dungeon-arrow').textContent=open?'▼':'▶'}
 });

function connect(){
 if(firebaseConfig.apiKey.includes('COLLE')){$('#sync').textContent='⚠️ Configuration Firebase manquante : remplis firebaseConfig dans index.html.';return}
 try{db=getFirestore(initializeApp(firebaseConfig))}catch(e){$('#sync').textContent='⚠️ Configuration Firebase invalide';return}
 coll=mk(SPACE,'entries');cuColl=mk(SPACE,'lieux');gColl=mk(SPACE,'guilds');
 const err=e=>{$('#sync').textContent='⚠️ '+(e.code==='permission-denied'?'Accès refusé : publie les règles Firestore':(e.code||'erreur'))};
 coll.onSnapshot(s=>{const n={};s.docs.forEach(d=>{n[d.id]=d.data()});const hs=Object.keys(n).filter(k=>n[k].hidden).sort().join();const ch=hs!==hiddenSig;hiddenSig=hs;st=n;if(ch&&tab!=='guildes'){buildRows();drawTools()}else paint();$('#sync').textContent='🟢 Synchronisé en direct'},err);
 cuColl.onSnapshot(s=>{const n={};s.docs.forEach(d=>{n[d.id]=d.data()});cu=n;if(tab==='autres'||tab==='zones')buildRows()},err);
 gColl.onSnapshot(s=>{const n={};s.docs.forEach(d=>{n[d.id]=d.data()});gd=n;paint()},err);
}
connect();
setInterval(()=>{if(tab!=='guildes')paint()},60000);
</script>
